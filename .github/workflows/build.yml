name: Compile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          repository: crsvt/test
          ref: main

      - name: Setup
        run: bash setup.sh

      - name: Compile
        run: bash compile.sh

      - name: Check DTB
        run: |
          echo "=== Checking onclite DTB ==="
          if [ -f out/arch/arm64/boot/dts/vendor-legacy/qcom/onclite-titanium.dtb ]; then
            echo "✓ onclite-titanium.dtb built successfully"
            ls -la out/arch/arm64/boot/dts/vendor-legacy/qcom/
          else
            echo "✗ onclite-titanium.dtb NOT found"
            find out/arch/arm64/boot/dts/ -name "*.dtb" | head -20
          fi

      - name: Make zip
        run: |
          DATE_TIME=$(date +"%Y%m%d-%H%M")
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../kernel-onclite-${DATE_TIME}.zip *
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-onclite
          path: kernel-onclite-*.zip
          retention-days: 7
