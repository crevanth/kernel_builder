name: Compile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          repository: Coolpad-Note-3-Lite-Development/android_kernel_xiaomi_onc
          ref: test

      - name: Setup
        run: |
          bash -c "$(wget -O- https://github.com/crevanth/kernel_builder/raw/main/.github/workflows/setup.sh)"

      - name: Compile
        run: |
          bash -c "$(wget -O- https://github.com/crevanth/kernel_builder/raw/main/.github/workflows/compile.sh)"

      - name: Check DTB
        run: |
          echo "=== Checking onclite DTB ==="
          if [ -f out/arch/arm64/boot/dts/qcom/onclite/onclite.dtb ]; then
            echo "✓ onclite.dtb built successfully"
            ls -la out/arch/arm64/boot/dts/qcom/onclite/
          else
            echo "✗ onclite.dtb NOT found"
            echo "=== All DTBs built ==="
            find out/arch/arm64/boot/dts/ -name "*.dtb" | head -20
          fi

      - name: Make zip
        run: |
          DATE_TIME=$(date +"%Y%m%d-%H%M")
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../kernel-onclite-${DATE_TIME}.zip *
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: kernel-onclite
          path: kernel-onclite-*.zip
          retention-days: 7
